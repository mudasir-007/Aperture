server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the api service (Docker Compose service DNS name
    # "api"). This mirrors what vite.config.ts's dev-server proxy does for
    # local development, so the same /api-relative frontend code works in
    # both environments.
    location /api/ {
        proxy_pass http://api:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Single-page app: any unknown path falls back to index.html so
    # client-side routing (react-router) works on a hard refresh/deep link.
    location / {
        try_files $uri /index.html;
    }
}
